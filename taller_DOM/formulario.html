
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario con validación</title>
</head>
<body>

    <h1>Ejercicio 5: Formulario con validación</h1>

    <form id="formulario">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required>
        <br><br>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" required>
        <br><br>

        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" minlength="6" required>
        <br><br>

        <button type="submit">Enviar</button>

        <p id="mensaje"></p>

    </form>

    <script>
        let formulario = document.getElementById("formulario");
        let mensaje = document.getElementById("mensaje");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            let nombre = document.getElementById("nombre").value.trim();
            let correo = document.getElementById("correo").value.trim();
            let contrasena = document.getElementById("contrasena").value;

            if (nombre ==="" || correo === "" || contrasena === "") {
                mensaje.textContent = "Error: debes completar todos los campos.";
                mensaje.style.color = "red";
            } else if (contrasena.length < 6) {
                mensaje.textContent = "Error: la contraseña debe tener al menos 6 caracteres.";
                mensaje.style.color = "red";
            } else {
                mensaje.textContent = "Formulario validado correctamente.";
                mensaje.style.color = "green";

                console.log("Formulario válido para:", nombre, correo);
            }
        });
    </script>

</body>
</html>
